name: compile-check
# Throwaway: compile-only check for feat/passkey-picker-codes on a hosted Mac.
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift build -c release 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - run: swift test --filter "DataSettings|Password|Credential|TOTP" 2>&1 | tail -60
